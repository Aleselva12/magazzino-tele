name: magazzino-tele
services:
  db:
    image: magazzino-tele-mysql:8.4-local
    build:
      context: ./init
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: magazzino_tele
      MYSQL_USER: tele
      MYSQL_PASSWORD: ${TELE_DB_PASSWORD:?Set TELE_DB_PASSWORD in private .env}
      MYSQL_ROOT_PASSWORD: ${TELE_ROOT_PASSWORD:?Set TELE_ROOT_PASSWORD in private .env}
    volumes:
      - tele_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
  web:
    build: ../web
    restart: unless-stopped
    environment:
      TELE_DB_HOST: db
      TELE_DB_NAME: magazzino_tele
      TELE_DB_USER: tele
      TELE_DB_PASSWORD: ${TELE_DB_PASSWORD:?Missing}
      TELE_DEV_RESET_ENABLED: ${TELE_DEV_RESET_ENABLED:-false}
      TELE_DEV_RESET_TOKEN: ${TELE_DEV_RESET_TOKEN:-}
    volumes:
      - tele_reset_backups:/private-backups
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${TELE_TAILSCALE_IP:?Enter the server Tailscale IPv4}:8082:8082"
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  tele_reset_backups:
  tele_mysql:
