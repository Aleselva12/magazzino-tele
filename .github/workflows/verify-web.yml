name: Verify standalone web and MySQL
on:
  pull_request:
    paths: ['web/**','deploy/**','tests/**','.github/workflows/verify-web.yml']
  push:
    branches: [master]
jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      TELE_DB_PASSWORD: ci_password_not_real
      TELE_ROOT_PASSWORD: ci_root_password_not_real
      TELE_TAILSCALE_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python syntax and dependencies
        run: |
          python -m compileall -q web deploy tests/test_web_e2e.py
          python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Generate empty dependency-ordered schema
        run: |
          python deploy/prepare_schema.py
          python - <<'PY'
          from pathlib import Path
          from deploy.prepare_schema import ORDER
          text=Path("deploy/init/01-schema.sql").read_text()
          assert text.count("CREATE TABLE") == 7
          assert "INSERT INTO" not in text
          assert [line.split(chr(96))[1] for line in text.splitlines()
                  if line.startswith("CREATE TABLE")] == list(ORDER)
          print("DDL-only / seven dependency ordered tables: PASS")
          PY
      - name: Disposable host config
        run: |
          printf 'TELE_DB_PASSWORD=%s\nTELE_ROOT_PASSWORD=%s\nTELE_TAILSCALE_IP=%s\n' \
            "$TELE_DB_PASSWORD" "$TELE_ROOT_PASSWORD" "$TELE_TAILSCALE_IP" > deploy/.env
          chmod 600 deploy/.env
          docker compose --env-file deploy/.env -f deploy/compose.yml config --quiet
      - name: Start test database and web
        run: |
          docker compose --env-file deploy/.env -f deploy/compose.yml up -d --build --wait
      - name: Database schema verified and web workflows
        run: |
          python deploy/reconcile_schema.py
          python tests/test_web_e2e.py
      - name: Container logs on failure
        if: failure()
        run: docker compose --env-file deploy/.env -f deploy/compose.yml logs --tail=75
      - name: Stop disposable environment
        if: always()
        run: docker compose --env-file deploy/.env -f deploy/compose.yml down -v
